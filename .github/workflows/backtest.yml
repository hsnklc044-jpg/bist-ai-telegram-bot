name: Backtest

# Downloads real prices from Yahoo and runs the backtest on GitHub's
# servers. Start it from the Actions tab ("Run workflow"); results are
# shown on the run's summary page.

on:
  workflow_dispatch:
    inputs:
      args:
        description: "python -m core.backtest arguments (e.g. THYAO --stop-atr 1.5)"
        required: false
        default: ""
  push:
    paths:
      - ".github/workflows/backtest.yml"
      - "core/backtest/**"
      - "core/analytics/scoring.py"
      - "core/config/thresholds.py"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download prices
        run: python -m core.market.update | tee update.txt
      - name: Run backtest
        env:
          ARGS: ${{ github.event.inputs.args }}
        run: |
          python -m core.backtest $ARGS | tee backtest.txt
          {
            echo '## Backtest'
            echo '```'
            cat backtest.txt
            echo '```'
            echo '## Veri kalitesi'
            echo '```'
            cat update.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest
          path: |
            update.txt
            backtest.txt
