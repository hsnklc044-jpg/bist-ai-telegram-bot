name: Research

# Downloads real prices on GitHub's servers and runs the research
# reports, so no local computer is needed. It runs every Saturday, or start
# it from the Actions tab ("Run workflow"); the output is on the run's
# summary page.
#
# Results are kept on the `research-results` branch (Actions logs expire
# after 90 days): runs/<date>/*.txt and history.csv, one row per strategy
# per run, compared with the previous run (core.backtest.history).
# Runs with a custom --start are not added to the history.

on:
  schedule:
    - cron: "17 4 * * 6"  # Saturday 07:17 Istanbul
  workflow_dispatch:
    inputs:
      start:
        description: "core.backtest.research --start"
        required: false
        default: ""

permissions:
  contents: write  # push to the research-results branch only

concurrency:
  group: research
  cancel-in-progress: false

# A command piped into tee must fail its step when it fails (steps that
# may fail on purpose say "|| true").
defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      START: ${{ inputs.start }}
    steps:
      - uses: actions/checkout@v5
      - name: Results branch
        run: |
          echo "RUN_DATE=$(TZ=Europe/Istanbul date '+%Y-%m-%d %H:%M')" >> "$GITHUB_ENV"
          if git fetch --depth=1 origin research-results; then
            git worktree add -B research-results results FETCH_HEAD
          else
            git worktree add --orphan -b research-results results
          fi
          if [ -z "$START" ]; then echo "RECORDS=--records results/history.csv" >> "$GITHUB_ENV"; fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.lock
      - name: Download prices
        run: python -m core.market.update --bist100-history 2>&1 | tee update.txt || true
      - name: Strategy research
        run: python -m core.backtest.research ${START:+--start "$START"} $RECORDS --run-date "$RUN_DATE" 2>&1 | tee research.txt
      - name: Strategy research, today's list (survivorship-biased comparison)
        run: python -m core.backtest.research --universe today ${START:+--start "$START"} $RECORDS --run-date "$RUN_DATE" 2>&1 | tee research_today.txt
      - name: Strategy research with one-day close fixes (effect only, not recorded)
        continue-on-error: true  # experimental; its failure must not hide the rest
        run: |
          if [ -f results/datacheck/latest_price_fixes.csv ]; then
            python -m core.backtest.research ${START:+--start "$START"} \
              --price-fixes results/datacheck/latest_price_fixes.csv 2>&1 | tee research_fixed.txt
          else
            echo "Fiyat düzeltme dosyası yok (Data check çalışmadı)." | tee research_fixed.txt
          fi
      - name: Past results of the technical views (reference for /performans)
        run: python -m core.backtest.expectations --out view_expectations.csv 2>&1 | tee expectations.txt
      - name: Candidate rules, point-in-time BIST 100
        run: python -m core.backtest.candidates --pit 2>&1 | tee candidates.txt
      - name: Drawdown diagnosis (momentum)
        run: python -m core.backtest.diagnose 2>&1 | tee diagnose.txt
      - name: Holiday calendar against XU100 candles
        run: python -m core.market.calendar 2>&1 | tee calendar.txt
      - name: Second source check (İş Yatırım closes, last 30 days)
        run: python -m core.market.crosscheck --days 30 2>&1 | tee crosscheck.txt || true
      - name: Compare with the previous run
        if: always()
        run: python -m core.backtest.history results/history.csv 2>&1 | tee history.txt
      - name: Save results
        if: always()
        run: |
          folder="results/runs/$(echo "$RUN_DATE" | tr ' :' '_-')"
          mkdir -p "$folder"
          cp update.txt research.txt research_fixed.txt research_today.txt candidates.txt diagnose.txt calendar.txt crosscheck.txt history.txt expectations.txt view_expectations.csv "$folder"/ 2>/dev/null || true
          cd results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Research run $RUN_DATE (${GITHUB_SHA::7})" || exit 0
          git push origin research-results
      - name: Summary
        if: always()
        run: |
          for f in history crosscheck research research_fixed research_today expectations candidates diagnose calendar update; do
            echo "## $f" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "$f.txt" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(yok)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: research
          path: "*.txt"
