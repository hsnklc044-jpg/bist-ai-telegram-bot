name: Screen templates explain

# Why the /tara template cards differ from the user's own PC numbers
# (docs/RESEARCH_LOG.md): each template under each definition that can
# differ (liquidity floor, 10- or 20-day relative volume, costs). Explains,
# never selects; the output is in the run log and its summary page.

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  explain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.lock
      - name: Download prices
        run: python -m core.market.update --bist100-history > update.txt 2>&1 || true
      # K-76: which daily data the measurements below read (range, candles, sha256, commit)
      - name: Daily data provenance
        run: |
          python -m core.analytics.provenance daily 2>&1 | grep -v Warning | tee provenance.txt
          { echo '```'; cat provenance.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Template variants
        run: |
          python -m core.screen.templates --explain 2>&1 | tee explain.txt
          { echo '```'; cat explain.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Özellik A §3.3: do the support/resistance levels differ from random ones? (descriptive, K-49)
      - name: Levels study
        run: |
          python -m core.analytics.levels_study 2>&1 | tee levels.txt
          { echo '```'; cat levels.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Scenario template cards (K-55, screening period)
        run: |
          python -m core.analytics.scenarios_study 2>&1 | tee scenarios.txt
          { echo '```'; cat scenarios.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # BIST 30 hedefi, adım 2: the ML filter, out of sample only (holdout untouched)
      - name: ML filter (BIST 30 approximation)
        run: |
          python -m core.ml.ml_filter --universe bist30 2>&1 | tee ml30.txt
          { echo '```'; cat ml30.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: ML filter (BIST 100)
        run: |
          python -m core.ml.ml_filter --universe bist100 2>&1 | tee ml100.txt
          { echo '```'; cat ml100.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # K-62: the second rule, written before this measurement
      - name: ML filter goreli20 (BIST 30 approximation)
        run: |
          python -m core.ml.ml_filter --universe bist30 --rule goreli20 2>&1 | tee ml30r.txt
          { echo '```'; cat ml30r.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: ML filter goreli20 (BIST 100)
        run: |
          python -m core.ml.ml_filter --universe bist100 --rule goreli20 2>&1 | tee ml100r.txt
          { echo '```'; cat ml100r.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # K-64: the signal confirmation layer on daily BIST 100 (written before this measurement)
      - name: Signal confirmation layer (daily)
        run: |
          python -m core.ml.signal_filter --zaman gunluk 2>&1 | tee sfd.txt
          { echo '```'; cat sfd.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
