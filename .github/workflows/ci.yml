name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.lock
      - run: ruff check .
      # Windows reads and writes files as cp1254 unless told otherwise: any
      # open()/read_text()/write_text() without encoding= fails here.
      - run: python -X warn_default_encoding -W error::EncodingWarning -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t quantbist .
      - run: docker run --rm quantbist python -c "import bot.application, bot.scheduler, core.reports.daily"
