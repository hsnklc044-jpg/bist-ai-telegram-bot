name: Telegram notices

# Runs the QuantBIST notices without a server:
# - every weekday at 18:50 Istanbul: the monthly rebalance notice when
#   due, and the rotation report on Fridays
# - "Run workflow" button: sends the rotation report right away
#
# Needs two repository secrets (Settings -> Secrets and variables ->
# Actions): BOT_TOKEN and CHAT_ID.

on:
  schedule:
    - cron: "50 15 * * 1-5"  # 15:50 UTC = 18:50 Istanbul (UTC+3, no DST)
  workflow_dispatch:
    inputs:
      report:
        description: "Rotasyon raporunu şimdi gönder"
        type: boolean
        default: true

concurrency:
  group: telegram-notices
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send notices
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          REPORT: ${{ github.event_name == 'workflow_dispatch' && inputs.report }}
        run: |
          if [ "$REPORT" = "true" ]; then
            python -m bot.notify --report
          else
            python -m bot.notify
          fi
