name: Data check (full history)

# One-off / occasional: compares the full price history the backtests use
# (former BIST 100 members, corporate actions applied) with İş Yatırım's
# traded prices, year by year (a few hours for ~200 stocks). The report is
# saved on the research-results branch under datacheck/.

on:
  workflow_dispatch:
    inputs:
      start:
        description: "first day (YYYY-MM-DD)"
        required: false
        default: "2022-01-01"

permissions:
  contents: write  # push to the research-results branch only

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  datacheck:
    runs-on: ubuntu-latest
    timeout-minutes: 330  # ~200 stocks x 5 yearly requests; GitHub allows 360
    env:
      START: ${{ inputs.start }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.lock
      - name: Download prices
        run: python -m core.market.update --bist100-history > update.txt 2>&1 || true
      - name: Compare with İş Yatırım
        run: python -m core.market.crosscheck --start "${START:-2022-01-01}" --universe pit --adjusted 2>&1 | tee datacheck.txt
      - name: Save report
        if: always()
        run: |
          stamp=$(TZ=Europe/Istanbul date '+%Y-%m-%d_%H-%M')
          if git fetch --depth=1 origin research-results; then
            git worktree add -B research-results results FETCH_HEAD
          else
            git worktree add --orphan -b research-results results
          fi
          mkdir -p results/datacheck
          cp datacheck.txt "results/datacheck/$stamp.txt" 2>/dev/null || exit 0
          cd results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Data check $stamp (${GITHUB_SHA::7})" || exit 0
          git push origin research-results
      - name: Summary
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat datacheck.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(yok)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
