  <script>
  
    function displayResult(xslLocation, xmlLocation) {
      var date = $('.calendar-picker').datepicker("getDate");
      $.ajax({
        type: "GET",
        url: xmlLocation,
        timeout: 20000,
        cache: false,
        //beforeSend: function (jqXHR) {
          //jqXHR.overrideMimeType('text/xml;charset=iso-8859-9');
        //},
        success: function (xml) {
          $.ajax({
            type: "GET",
            url: xslLocation,
            timeout: 20000,
            cache: false,
            //beforeSend: function (jqXHR) {
              // jqXHR.overrideMimeType('text/xml;charset=iso-8859-9');
            //},
            success: function (xsl) {
              if (window.ActiveXObject || "ActiveXObject" in window) {
                var xslt = new ActiveXObject("Msxml2.XSLTemplate.3.0");
                var xslDoc = new ActiveXObject("Msxml2.FreeThreadedDOMDocument.3.0");
                var xslProc;
                xslDoc.async = false;
                xslDoc.load(xsl);

                if (xslDoc.parseError.errorCode != 0) {
                  var myErr = xslDoc.parseError;
                  alert("Hata olustu." + myErr.reason);
                } else {
                  xslt.stylesheet = xslDoc;
                  var xmlDoc = new ActiveXObject("Msxml2.DOMDocument.3.0");
                  xmlDoc.async = false;
                  xmlDoc.load(xml);
                  if (xmlDoc.parseError.errorCode != 0) {
                    var myErr = xmlDoc.parseError;
                    alert("Hata olustu. " + myErr.reason);
                  } else {
                    xslProc = xslt.createProcessor();
                    xslProc.input = xmlDoc;
                    xslProc.transform();
                    document.getElementById("data").innerHTML = "";
                    $(xslProc.output).appendTo("#data");
                  }
                }
              } else {
                xsltProcessor = new XSLTProcessor();
                xsltProcessor.importStylesheet(xsl);
                resultDocument = xsltProcessor.transformToFragment(xml, document);
                document.getElementById("data").innerHTML = "";
                document.getElementById("data").appendChild(resultDocument);
              }
            }
          });
        },
        error: function (r, s, e) {
          document.getElementById("data").innerHTML = "";
          document.getElementById("data").innerHTML = "<p style='text-align: center;margin: 50px 0;'>Resmi tatil, hafta sonu ve yarım iş günü çalışılan günlerde gösterge niteliginde kur bilgisi yayımlanmamaktadır.</p>";
        }
      });
    }

    var curMonth;

    // initial date to initialize date component. This will change on selecting the date from calendar
    currentDate = new Date();
    //currentDate.setMonth("0");
    // to manually set currentDate, 
    // currentDate.setMonth('0'); // month starts from 0 as January
    // currentDate.setDate('1'); // date starts from 1 as 1st of the month
    // currentDate.setFullYear('2017');
    pastYearLimit = 1996;

    $(document).ready(function () {
	  $(".printit").click(function () {
        window.print();		
      });	
      initCalendarTabs();
      calenderTabs(currentDate.getFullYear() - 4, currentDate.getFullYear());
    });

    $('.calendar-month').click(
      function () {
        if (!$(this).hasClass('active')) {
          curMonth.removeClass('active');
          $(this).addClass('active')
          var curM = $(this).attr("data-month");
          var d = new Date();
          d.setMonth(curM);
          $('.calendar-picker').datepicker('setDate', d);
          curMonth = $(this);
        }
      }
    );
    $('.block-tabs-tab').click(
      function () {
        var curY = $(this).attr("data-year");
        var d = new Date();
        d.setYear(curY);
        $('.calendar-picker').datepicker('setDate', d);
        $('.calendar-month').removeClass('active');
        var date = new Date();
        var n = date.getMonth();
        curMonth = $(".calendar-month[data-month='" + n + "']");
        curMonth.addClass('active');
      }
    );

    function initCalendarTabs() {
      var holidays = ["01/01", "23/04", "19/05", "30/08", "28/10", "29/10", "01/05", "15/07"];
      $('.calendar-picker').datepicker({
        inline: true,
        changeMonth: true,
        changeYear: true,
        dayNames: ["pazar", "pazartesi", "salı", "çarşamba", "perşembe", "cuma", "cumartesi"],
        dayNamesMin: ["Paz", "Pts", "Sal", "Çar", "Per", "Cum", "Cts"],
        firstDay: 1,
        dateFormat: "dd/mm/yy",
        stepMonths: 0,
        beforeShowDay: function (date) {
          if (date.getDay() == 0 || date.getDay() == 6) {
            return [false];
          } else {
            if (includes(holidays, $.datepicker.formatDate("dd/mm", date))) {
              if ($.datepicker.formatDate("dd/mm", date) == "01/05" && date.getFullYear() < 2009) {
                return [true];
              } else if ($.datepicker.formatDate("dd/mm", date) == "15/07" && date.getFullYear() < 2017) {
                return [true];
              } else {
                return [false];
              }
            } else {
              var x = new Date();
	      var y = new Date('1996-04-16 00:00:00');
              if (date.getTime() > x.getTime()) {
                return [false];
              } else if(date.getTime() < y.getTime()){
		return [false];
	      }else {
                return [true];
              }
            }
          }
        },
        onSelect: function (dateStr) {
          var date = new Date;
	  let month = dateStr.split("/")[1] - 1;
          let day = dateStr.split("/")[0];
          let year = dateStr.split("/")[2];
          /*date.setMonth(dateStr.split("/")[1] - 1);
          /*date.setDate(dateStr.split("/")[0]);
          date.setYear(dateStr.split("/")[2]);*/
          date = new Date(year,month,day);
          currentDate = date;
          $('.calendar-picker').datepicker('setDate', currentDate);
        }
      });

      function includes(holidays, element) {
        var exist = false;
        $(holidays).each(function (k, v) {
          if (v == element) {
            exist = true;
            return false;
          }
        });
        return exist;
      }

      // set date
      var currentDate = new Date();
      currentDate.setDate(currentDate.getDate() - 1);
      while (0 < 1) {
        if ((currentDate.getDay() == 0 || currentDate.getDay() == 6) ||
          includes(holidays, $.datepicker.formatDate("dd/mm", currentDate))) {
          currentDate.setDate(currentDate.getDate() - 1);
        } else {
          break;
        }
      }
      $('.calendar-picker').datepicker('setDate', currentDate);

      var date = new Date();
      var n = date.getMonth();
      curMonth = $(".calendar-month[data-month='" + n + "']");
      curMonth.addClass('active');
    }
    function calenderTabs(from, to) {
      // tabs wraper
      var content = '<div class="block-tabs-bar w-tab-menu">';
      // add tabs
      if (to < currentDate.getFullYear()) {
        content += '<a data-w-tab="Tab 7"' +
          'data-year="2017"' +
          'class="block-tabs-tab prev w-inline-block w-tab-link"' +
          'onclick="calenderTabs(' + (to + 1) + ', ' + (to + 5) + ')">' +
          '<div>' + (to + 5) + ' - ' + (to + 1) + '</div>' +
          '</a>';
      }
      for (var i = to; i >= from; i--) {
        var isCurrent = i == to ? 'w--current' : '';
        content += '<a data-w-tab="Tab ' + i + '"' +
          'data-year="' + i + '"' +
          'class="block-tabs-tab w-inline-block w-tab-link ' + isCurrent + '">' +
          '<div>' + i + '</div>' +
          '</a>';
      }
      // if ((from - 5) >= pastYearLimit) {
      //   content += '<a data-w-tab="Tab 6"
      //        class="block-tabs-tab next w-inline-block w-tab-link" onclick="calenderTabs('+ (from - 5) + ', ' + (from - 1) + ')">
      //       <div>'+ (from - 1) + ' - ' + (from - 5) + '</div>
      //     </a>';
      // }
      if ((from - 5) >= pastYearLimit) {
        content += '<a data-w-tab="Tab 6"' +
          'class="block-tabs-tab next w-inline-block w-tab-link" onclick="calenderTabs(' + (from - 5) + ', ' + (from - 1) + ')">' +
          '<div>' + (from - 1) + ' - ' + (from - 5) + '</div>' +
          '</a>';
      } else if ((from - 5) <= pastYearLimit && (from - 5) > (pastYearLimit - 5)) {
        content += '<a data-w-tab="Tab 6"' +
          'class="block-tabs-tab next w-inline-block w-tab-link" onclick="calenderTabs(' + pastYearLimit + ', ' + (from - 1) + ')">' +
          '<div>' + (from - 1) + ' - ' + pastYearLimit + '</div>' +
          '</a>';
      }
      content += "</div>";

      // tab content wrapper
      content += '<div class="w-tab-content">';
      // add tab contents
      for (var i = to; i >= from; i--) {
        var isCurrent = i == to ? 'w--tab-active' : '';
        content += '<div data-w-tab="Tab ' + i + '"' +
          'class="block-tabs-content w-tab-pane ' + isCurrent + '">' +
          '<div class="w-form">' +
          '<div class="calendar">' +
          '<div class="calendar-months w-clearfix">' +
          '<div class="calendar-months-title">Ay</div>' +
          '<div class="calendar-months-list">' +
          '<a href="#"' +
          'data-month="0"' +
          'data-year="' + i + '"' +
          'class="calendar-month w-inline-block ' + (currentDate.getMonth() == 0 ? 'active' : '') + '">' +
          '<div class="calendar-month-number">01</div>' +
          '<div class="calendar-month-word">Ocak</div>' +
          '</a>' +
          '<a href="#"' +
          'data-month="1"' +
          'data-year="' + i + '"' +
          'class="calendar-month w-inline-block ' + (currentDate.getMonth() == 1 ? 'active' : '') + '">' +
          '<div class="calendar-month-number">02</div>' +
          '<div class="calendar-month-word">Şubat</div>' +
          '</a>' +
          '<a href="#"' +
          'data-month="2"' +
          'data-year="' + i + '"' +
          'class="calendar-month w-inline-block ' + (currentDate.getMonth() == 2 ? 'active' : '') + '">' +
          '<div class="calendar-month-number">03</div>' +
          '<div class="calendar-month-word">Mart</div>' +
          '</a>' +
          '<a href="#"' +
          'data-month="3"' +
          'data-year="' + i + '"' +
          'class="calendar-month w-inline-block ' + (currentDate.getMonth() == 3 ? 'active' : '') + '">' +
          '<div class="calendar-month-number">04</div>' +
          '<div class="calendar-month-word">Nisan</div>' +
          '</a>' +
          '<a href="#"' +
          'data-month="4"' +
          'data-year="' + i + '"' +
          'class="calendar-month w-inline-block ' + (currentDate.getMonth() == 4 ? 'active' : '') + '">' +
          '<div class="calendar-month-number">05</div>' +
          '<div class="calendar-month-word">Mayıs</div>' +
          '</a>' +
          '<a href="#"' +
          'data-month="5"' +
          'data-year="' + i + '"' +
          'class="calendar-month w-inline-block ' + (currentDate.getMonth() == 5 ? 'active' : '') + '">' +
          '<div class="calendar-month-number">06</div>' +
          '<div class="calendar-month-word">Haziran</div>' +
          '</a>' +
          '<a href="#"' +
          'data-month="6"' +
          'data-year="' + i + '"' +
          'class="calendar-month w-inline-block ' + (currentDate.getMonth() == 6 ? 'active' : '') + '">' +
          '<div class="calendar-month-number">07</div>' +
          '<div class="calendar-month-word">Temmuz</div>' +
          '</a>' +
          '<a href="#"' +
          'data-month="7"' +
          'data-year="' + i + '"' +
          'class="calendar-month w-inline-block ' + (currentDate.getMonth() == 7 ? 'active' : '') + '">' +
          '<div class="calendar-month-number">08</div>' +
          '<div class="calendar-month-word">Ağustos</div>' +
          '</a>' +
          '<a href="#"' +
          'data-month="8"' +
          'data-year="' + i + '"' +
          'class="calendar-month w-inline-block ' + (currentDate.getMonth() == 8 ? 'active' : '') + '">' +
          '<div class="calendar-month-number">09</div>' +
          '<div class="calendar-month-word">Eylül</div>' +
          '</a>' +
          '<a href="#"' +
          'data-month="9"' +
          'data-year="' + i + '"' +
          'class="calendar-month w-inline-block ' + (currentDate.getMonth() == 9 ? 'active' : '') + '">' +
          '<div class="calendar-month-number">10</div>' +
          '<div class="calendar-month-word">Ekim</div>' +
          '</a>' +
          '<a href="#"' +
          'data-month="10"' +
          'data-year="' + i + '"' +
          'class="calendar-month w-inline-block ' + (currentDate.getMonth() == 10 ? 'active' : '') + '">' +
          '<div class="calendar-month-number">11</div>' +
          '<div class="calendar-month-word">Kasım</div>' +
          '</a>' +
          '<a href="#"' +
          'data-month="11"' +
          'data-year="' + i + '"' +
          'class="calendar-month w-inline-block ' + (currentDate.getMonth() == 11 ? 'active' : '') + '">' +
          '<div class="calendar-month-number">12</div>' +
          '<div class="calendar-month-word">Aralık</div>' +
          '</a>' +
          '</div>' +
          '</div>' +
          '<div class="calendar-picker"></div>' +
          '<input type="submit"' +
          'value="Göster"' +
          'data-wait="Lütfen bekleyiniz..."' +
          'class="form-button w-button email-form-2-submit">' +
          '</div>' +
          '</div>' +
          '</div>';
      }
      content += '</div>';

      $("#calendar_report").html(content);
      initCalendarTabs();

      $(".w-tab-menu a[data-w-tab]").unbind("click");
      $(".w-tab-menu a[data-w-tab]").click(function (e) {
        e.preventDefault();
        $(".w-tab-menu a[data-w-tab]").removeClass("w--current");
        $(this).addClass("w--current");
        $(".w-tab-pane[data-w-tab]").hide();
        $(".w-tab-pane[data-w-tab='Tab " + $(this).data('year') + "']").fadeIn();

        // set calendar date and year
        var year = new Date();

        year.setDate("1");
        year.setMonth("0");
        year.setFullYear($(this).data('year').toString());
        $('.calendar-picker').datepicker('setDate', year);

        $(".w-tab-pane[data-w-tab='Tab " + $(this).data('year') + "']").children().find(".calendar-months a[data-month='0']").trigger("click");
      });

      $(".calendar-months a[data-month]").unbind("click");
      $(".calendar-months a[data-month]").click(function (e) {
        e.preventDefault();

        $(this).siblings().removeClass("active");
        $(this).addClass("active");

        var month = new Date();

        if ($(this).data('year') != month.getFullYear()) {
          month.setDate("1");
        }
        if ($(this).data('month') != month.getMonth()) {
          month.setDate("1");
          month.setMonth($(this).data('month').toString());
        }
        month.setFullYear($(this).data('year').toString());
        $('.calendar-picker').datepicker('setDate', month);

      });
      var month = new Date();
      //month.setDate("1");
      //month.setMonth("0");
      month.setFullYear(to.toString());
      $('.calendar-picker').datepicker('setDate', month);

      $(".w-tab-pane[data-w-tab='Tab " + currentDate.getFullYear() + "']").children().find(".calendar-months a[data-month='" + currentDate.getMonth() + "']").trigger("click");

      $(".email-form-2-submit").unbind("click");
      $(".email-form-2-submit").click(function (e) {
        e.preventDefault();

        let xsl_name = 'isokur-new';        
        let selectedDate = $('.calendar-picker').datepicker('getDate');
        let yilAy = moment(selectedDate ).format('YYYYMM');
        let gunAyYil = moment(selectedDate ).format('DDMMYYYY');
        let buildedRequestXmlUrl = yilAy +'/' + gunAyYil + '.xml';
        let buildedRequestXslUrl = yilAy +'/' + xsl_name + '.xsl';
		//let buildedRequestXmlUrl = 'isokur.xml';
        //let buildedRequestXslUrl = 'isokur.xsl';
        displayResult(buildedRequestXslUrl, buildedRequestXmlUrl);
        $("#back").show();
        $("#data").show();
        $("#calendar_report").hide();
        $(".footnote").hide();
      });
      $("#back").unbind("click");
      $("#back").click(function (e) {
        e.preventDefault();
        $("#back").hide();
        $("#data").hide();
        $("#calendar_report").show();
        $(".footnote").show();
      });
    }

  </script>
