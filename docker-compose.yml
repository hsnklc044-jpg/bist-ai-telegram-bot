# Runs the bot 24/7 on a server and restarts it after crashes or reboots.
# The daily report is sent by the bot itself (DAILY_REPORT_AT in .env).
#
#   cp .env.example .env      # BOT_TOKEN, CHAT_ID, DAILY_REPORT_AT=18:30
#   docker compose run --rm bot python -m core.market.update   # first download
#   docker compose up -d --build
#   docker compose logs -f
services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      # prices, ledger, paper orders, watchlist and logs live on the host
      # and survive rebuilds and updates
      - ./data:/app/data
      - ./logs:/app/logs
