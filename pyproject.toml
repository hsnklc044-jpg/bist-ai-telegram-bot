[project]
name = "quantbist"
version = "0.32.1"
description = "BIST hisse analizi, sinyal ve raporlama botu"
requires-python = ">=3.11,<3.12"  # tested on 3.11; see requirements.lock

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["reports", "logs", "data"]

[tool.ruff.lint]
select = ["E9", "F", "I", "E402", "B006", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["core", "bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # starlette's TestClient (tests only) prefers the new httpx2 package; the bot itself
    # uses httpx through python-telegram-bot, so no extra dependency is added for this.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]
